# ══════════════════════════════════════════════════════
#  Nginx — Load Balancer FastAPI x3
#  Clinique Connectée — M1 BD-GL UFHB 2025-2026
# ══════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {

    # ── Upstream : 3 instances FastAPI ───────────────
    upstream fastapi_cluster {
        least_conn;                         # Algo : moins de connexions actives
        server clinique_api_1:8000 weight=1;
        server clinique_api_2:8000 weight=1;
        server clinique_api_3:8000 weight=1;

        keepalive 32;                       # Connexions persistantes
    }

    # ── Rate limiting ─────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ── Logs ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Timeouts ──────────────────────────────────────
    proxy_connect_timeout   10s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    send_timeout            30s;

    # ── Headers communs ───────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ══════════════════════════════════════════════════
    #  Serveur HTTP (port 80)
    # ══════════════════════════════════════════════════
    server {
        listen 80;
        server_name localhost;

        # ── Health check Nginx ────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── Auth — rate limit strict ──────────────────
        location /auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://fastapi_cluster;
        }

        # ── SSE alertes — flux infini, timeout dédié ──
        # Bloc distinct de /api/ : ce flux reste ouvert indéfiniment,
        # il ne doit JAMAIS hériter du proxy_read_timeout global (30s)
        # sous peine de 504 Gateway Time-out côté nginx après ~30s,
        # même quand le backend répond parfaitement (cf. logs api-1).
        location /api/alertes/stream {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }

        # ── API principale ────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_cluster;
            # CORS géré uniquement par FastAPI (CORSMiddleware dans main.py) —
            # ne pas le dupliquer ici, sinon le navigateur reçoit deux fois le
            # header Access-Control-Allow-Origin ("*, *") et bloque tout.
        }

        # ── Swagger UI ────────────────────────────────
        location /docs {
            proxy_pass http://fastapi_cluster;
        }

        location /openapi.json {
            proxy_pass http://fastapi_cluster;
        }

        # ── Racine → docs ─────────────────────────────
        location / {
            proxy_pass http://fastapi_cluster;
        }
    }
}