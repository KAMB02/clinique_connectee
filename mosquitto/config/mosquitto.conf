# ── Listener MQTT principal sécurisé (TLS) ───────────────
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

# ── Listener WebSocket (dashboard React temps réel) ─────────
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# Pour utiliser WSS, configurez le client web sur wss://<host>:9002

# ── Persistance messages ─────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ── Logs complets (pour analyse attaque + Kibana) ────────────
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
